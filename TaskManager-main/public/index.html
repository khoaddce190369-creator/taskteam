<!DOCTYPE html>
<html lang="vi" spellcheck="false">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Bảng phân công nhiệm vụ - Quản lý công việc nhóm chuyên nghiệp">

    <title>Bảng Phân Công Nhiệm Vụ</title>

    <link rel="stylesheet" href="style.css?v=2">

</head>

<body>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <header class="header">
        <h1>Bảng Phân Công Nhiệm Vụ</h1>
        <div class="subject-selector">
            <select id="subjectSelect"></select>
            <button id="addSubjectBtn" class="btn-primary">+ Thêm môn</button>
        </div>
    </header>

    <nav class="tab-container">

        <button class="tab active" data-file="master-task">
            Nhiệm vụ tổng
        </button>

        <button class="tab" data-file="khoa">
            Khoa
        </button>

        <button class="tab" data-file="thai">
            Thái
        </button>

        <button class="tab" data-file="nhannghia">
            Nhân Nghĩa
        </button>

        <button class="tab" data-file="trong">
            Trọng
        </button>

        <button class="tab" data-file="doannghia">
            Đoàn Nghĩa
        </button>

        <button class="tab" id="reportTab">
            Báo cáo
        </button>

        <button class="tab" id="progressTab">
            Tiến độ hiện tại
        </button>

        <button class="tab" id="logTab">
            Nhật ký hoạt động
        </button>

    </nav>

    <div class="dashboard">

        <div class="card card-animate" style="animation-delay: 0s">
            <span id="totalTasks">0</span>
            <p>Tổng Task</p>
        </div>

        <div class="card card-animate" style="animation-delay: 0.05s">
            <span id="doneTasks">0</span>
            <p>Done</p>
        </div>

        <div class="card card-animate" style="animation-delay: 0.1s">
            <span id="doingTasks">0</span>
            <p>In Progress</p>
        </div>

        <div class="card card-animate" style="animation-delay: 0.15s">
            <span id="pendingTasks">0</span>
            <p>Pending</p>
        </div>

    </div>

    <div class="toolbar">

        <button id="addTaskBtn">
            THÊM TASK
        </button>

        <button id="refreshBtn">
            LÀM MỚI
        </button>

        <button id="syncBtn">
            ĐỒNG BỘ GITHUB
        </button>

        <button id="importBtn">
            IMPORT JSON
        </button>

        <button id="exportBtn">
            EXPORT EXCEL
        </button>

        <button id="exportMdBtn">
            EXPORT MD
        </button>

        <input type="file" id="jsonFile" accept=".json" hidden>

    </div>

    <div id="contentArea">

        <div id="taskSection">

            <table>

                <thead>
                    <tr>
                        <th class="col-name">Tên Task</th>
                        <th class="col-desc">Nội dung</th>
                        <th class="col-deadline">Deadline</th>
                        <th class="col-progress">Tiến độ</th>
                        <th class="col-note">Ghi chú</th>
                        <th class="col-status">Trạng thái</th>
                        <th class="col-actions">Hành động</th>
                    </tr>
                </thead>

                <tbody id="taskTable">
                </tbody>

            </table>

        </div>

        <div id="reportSection" class="hidden">

            <h2>Báo cáo công việc</h2>

            <div class="report-form">

                <label class="form-label" for="reportUser">Người gửi</label>
                <input id="reportUser" placeholder="Nhập tên người gửi">

                <label class="form-label" for="reportContent">Nội dung báo cáo</label>
                <textarea id="reportContent" placeholder="Nhập nội dung báo cáo"></textarea>

                <button id="submitReport">
                    GỬI BÁO CÁO
                </button>

            </div>

            <div id="reportList">
            </div>

        </div>

        <div id="progressSection" class="hidden">

            <h2>Tiến độ hiện tại</h2>

            <div id="progressContainer">
            </div>

        </div>

        <div id="logSection" class="hidden">

            <h2>Nhật ký hoạt động</h2>

            <div id="activityLog">
            </div>

        </div>

    </div>

    <!-- Add Task Modal -->
    <div id="taskModal" class="modal hidden">

        <div class="modal-content">

            <h2>Thêm Task</h2>

            <label class="form-label" for="assignee">Người thực hiện</label>
            <select id="assignee">
                <option value="">Chọn người thực hiện</option>
                <option value="khoa">Khoa</option>
                <option value="thai">Thái</option>
                <option value="nhannghia">Nhân Nghĩa</option>
                <option value="trong">Trọng</option>
                <option value="doannghia">Đoàn Nghĩa</option>
            </select>

            <label class="form-label" for="taskName">Tên Task</label>
            <input id="taskName" placeholder="Nhập tên task">

            <label class="form-label" for="description">Nội dung nhiệm vụ</label>
            <textarea id="description" placeholder="Mô tả nội dung nhiệm vụ"></textarea>

            <label class="form-label" for="deadline">Deadline</label>
            <input id="deadline" type="date">

            <label class="form-label" for="progress">Tiến độ hoàn thành (%)</label>
            <input id="progress" type="number" min="0" max="100" placeholder="0 - 100">

            <label class="form-label" for="note">Ghi chú</label>
            <textarea id="note" placeholder="Ghi chú thêm"></textarea>

            <label class="form-label" for="status">Trạng thái</label>
            <select id="status">
                <option>Pending</option>
                <option>In Progress</option>
                <option>Done</option>
            </select>

            <div class="modal-actions">
                <button id="closeModal">ĐÓNG</button>
                <button id="saveTask">LƯU</button>
            </div>

        </div>

    </div>

    <!-- Edit Task Modal -->
    <div id="editModal" class="modal hidden">

        <div class="modal-content">

            <h2>Chỉnh sửa Task</h2>

            <label class="form-label" for="editTaskName">Tên Task</label>
            <input id="editTaskName" placeholder="Tên Task">

            <label class="form-label" for="editDescription">Nội dung</label>
            <textarea id="editDescription" placeholder="Nội dung"></textarea>

            <label class="form-label" for="editDeadline">Deadline</label>
            <input id="editDeadline" type="date">

            <label class="form-label" for="editProgress">Tiến độ</label>
            <input id="editProgress" type="number" min="0" max="100" placeholder="0 - 100">

            <label class="form-label" for="editNote">Ghi chú</label>
            <textarea id="editNote" placeholder="Ghi chú"></textarea>

            <label class="form-label" for="editStatus">Trạng thái</label>
            <select id="editStatus">
                <option>Pending</option>
                <option>In Progress</option>
                <option>Done</option>
            </select>

            <div class="modal-actions">
                <button id="closeEditModal">ĐÓNG</button>
                <button id="updateTaskBtn">CẬP NHẬT</button>
            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
